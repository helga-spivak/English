<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English — Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #222;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      margin-bottom: 40px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    .subtitle {
      margin-top: 10px;
      color: #666;
      font-size: 18px;
      line-height: 1.5;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .card {
      display: block;
      background: white;
      border-radius: 18px;
      padding: 28px;
      text-decoration: none;
      color: #222;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    .card-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .card-text {
      color: #666;
      line-height: 1.5;
      font-size: 16px;
    }

    .empty {
      color: #888;
      font-style: italic;
    }

    .footer {
      margin-top: 60px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px;
      }

      h1 {
        font-size: 34px;
      }

      .cards {
        gap: 18px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>English Practice</h1>

      <p class="subtitle">
        Interactive English exercises, vocabulary practice
        and learning materials
      </p>
    </div>

    <div id="grid" class="cards"></div>

    <div class="footer">
      GitHub Pages •
      <a href="https://github.com/helga-spivak/English"
         target="_blank"
         rel="noopener noreferrer">
        English Project
      </a>
    </div>

  </div>

  <script>
    // Add new pages to this array.
    const pages = [
      {
        title: 'OVER — Phrasal Verb Lab',
        href: '/Over.html',
        desc: 'Interactive exercises to practice phrasal verbs with "over".'
      },
      {
        title: 'B2+ Vocabulary Practice — Building a Landmark',
        href: 'vocab_b2plus_exercise.html',
        desc: 'Vocabulary exercises for B2+ English learners.'
      },
      {
        title: 'C1+ Vocabulary Practice — Building a Landmark',
        href: 'vocab_c1_exercise.html',
        desc: 'Advanced vocabulary exercises for C1+ English learners.'
      },
      {
        title: 'C1 Vocabulary Practice',
        href: 'c1_practice',
        desc: 'Interactive vocabulary practice for C1 level.'
      },
      {
        title: 'B2+ Vocabulary Practice — Travelling with Kids',
        href: 'b2_travellingWithKids.html',
        desc: 'Vocabulary exercises about travelling with kids.'
      },
      {
        title: 'B2+ Vocabulary Practice — Biology',
        href: 'b2_travellingWithKids.html',
        desc: 'Vocabulary exercises related to biology.'
      }
    ];

    const grid = document.getElementById('grid');

    if (pages.length === 0) {
      grid.innerHTML = `
        <div class="card empty">
          No pages yet.
        </div>
      `;
    } else {
      grid.innerHTML = pages.map(page => `
        <a class="card" href="${page.href}">
          <div class="card-title">
            ${page.title}
          </div>
          <div class="card-text">
            ${page.desc || ''}
          </div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
