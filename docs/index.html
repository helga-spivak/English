<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-strong: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-strong: #3b82f6;
        --border: rgba(148, 163, 184, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .topbar {
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
      }

      .nav {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .brand {
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
      }

      .menu {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .menu a {
        color: var(--text);
        opacity: 0.9;
      }

      .menu a:hover {
        opacity: 1;
        text-decoration: none;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .card {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .subtitle {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 22px;
      }

      .section-title {
        margin-top: 28px;
        margin-bottom: 12px;
        font-size: 1.2rem;
      }

      ul {
        padding-left: 18px;
        line-height: 1.8;
        color: var(--text);
      }

      .meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="https://github.com/helga-spivak/English" target="_blank" rel="noreferrer">helga-spivak / English</a>
        <div class="menu">
          <a href="../README.md">README</a>
          <a href="../LICENSE">License</a>
          <a href="https://github.com/helga-spivak/English/issues" target="_blank" rel="noreferrer">Issues</a>
          <a href="https://github.com/helga-spivak/English" target="_blank" rel="noreferrer">Repository</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <h1>English</h1>
        <p class="subtitle">
          A repository landing page for quick navigation to the project overview, license, and issue tracking.
        </p>

        <h2 class="section-title">Navigation</h2>
        <ul>
          <li><a href="../Over.html">Open OVER</a></li>
        </ul>

        <p class="meta">Repository: helga-spivak / English</p>
      </section>
    </main>
  </body>
</html>
